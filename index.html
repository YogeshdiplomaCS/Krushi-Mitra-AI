
<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      margin: 0;
      color: #173d27;
      background: transparent;
    }

    .panel {
      border: 1px solid #d6e8d8;
      border-radius: 14px;
      padding: 14px;
      background: #f8fff8;
    }

    .hint {
      font-size: 12px;
      color: #5d7463;
      margin: 6px 0;
    }

    .btn {
      border: 0;
      border-radius: 10px;
      padding: 10px 14px;
      font-weight: 650;
      background: #176b3b;
      color: white;
      cursor: pointer;
      margin-top: 6px;
    }

    .btn:disabled {
      opacity: .55;
      cursor: wait;
    }

    input {
      width: 100%;
      padding: 10px;
      border: 1px solid #cbdccc;
      border-radius: 9px;
      margin: 7px 0;
      font: inherit;
    }

    .status {
      font-size: 13px;
      margin-top: 9px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .ok { color: #176b3b; }
    .bad { color: #b42318; }
  </style>

  <!-- Streamlit component library -->
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
</head>

<body>
  <div id="root" class="panel">Loading verification...</div>

  <script type="module">
    import { Streamlit } from "https://esm.sh/streamlit-component-lib@2.0.0?bundle";

    let mode = "";
    let firebaseReady = false;
    let confirmation = null;
    let recaptcha = null;
    let lastPhone = "";
    let captchaWidget = null;
    let captchaScriptLoading = false;
    let currentArgs = {};

    function setStatus(message, success = false) {
      const element = document.getElementById("status");

      if (element) {
        element.className = "status " + (success ? "ok" : "bad");
        element.textContent = message;
      }
    }

    function showError(message) {
      const root = document.getElementById("root");
      root.innerHTML = "";

      const text = document.createElement("div");
      text.className = "status bad";
      text.textContent = message;

      root.appendChild(text);
    }

    function sendValue(value) {
      if (Streamlit && typeof Streamlit.setComponentValue === "function") {
        Streamlit.setComponentValue(value);
      }
    }

    function initializeFirebase(config) {
      if (!window.firebase || !window.firebase.auth) {
        throw new Error(
          "Firebase scripts failed to load. Check your internet connection."
        );
      }

      if (!firebaseReady) {
        if (!config || !config.apiKey || !config.projectId || !config.appId) {
          throw new Error("Firebase configuration is incomplete.");
        }

        if (!firebase.apps.length) {
          firebase.initializeApp(config);
        }

        firebaseReady = true;
      }

      const auth = firebase.auth();
      auth.languageCode = "en";

      return auth;
    }

    function renderPhone(args) {
      const root = document.getElementById("root");

      root.innerHTML = `
        <div>
          <strong>📱 Verify your mobile number</strong>
          <p class="hint">
            Verify your phone number using Firebase SMS OTP.
            Include the country code, for example +91XXXXXXXXXX.
          </p>

          <div id="recaptcha-container"></div>

          <button class="btn" id="send" type="button">
            Send OTP
          </button>

          <div id="otp-area" style="display:none">
            <input
              id="otp"
              type="text"
              inputmode="numeric"
              autocomplete="one-time-code"
              maxlength="6"
              placeholder="Enter 6-digit OTP"
            >

            <button class="btn" id="verify" type="button">
              Verify OTP
            </button>
          </div>

          <div id="status" class="status">
            Complete phone verification before creating your account.
          </div>
        </div>
      `;

      let auth;

      try {
        auth = initializeFirebase(args.firebaseConfig);

        if (recaptcha) {
          try {
            recaptcha.clear();
          } catch (error) {
            // Ignore an already disposed verifier.
          }

          recaptcha = null;
        }

        recaptcha = new firebase.auth.RecaptchaVerifier(
          "recaptcha-container",
          {
            size: "normal",
            callback: function () {
              setStatus(
                "reCAPTCHA completed. You can send the OTP now.",
                true
              );
            },
            "expired-callback": function () {
              setStatus("reCAPTCHA expired. Please verify again.");
            }
          }
        );

        recaptcha.render().catch(function (error) {
          setStatus("Could not initialize reCAPTCHA: " + error.message);
        });
      } catch (error) {
        setStatus("Firebase setup error: " + error.message);
      }

      document.getElementById("send").onclick = async function () {
        const phone = String(args.phone || "").trim();

        if (!/^\+[1-9]\d{7,14}$/.test(phone)) {
          setStatus(
            "Enter a valid international phone number, e.g. +919876543210."
          );
          return;
        }

        if (!auth || !recaptcha) {
          setStatus("Firebase or reCAPTCHA is not ready. Refresh and retry.");
          return;
        }

        const button = document.getElementById("send");
        button.disabled = true;

        try {
          confirmation = await auth.signInWithPhoneNumber(phone, recaptcha);
          lastPhone = phone;

          document.getElementById("otp-area").style.display = "block";

          setStatus("OTP sent. Check your phone and enter the code.", true);
        } catch (error) {
          setStatus("Could not send OTP: " + error.message);

          try {
            if (recaptcha) recaptcha.clear();
          } catch (ignored) {}

          recaptcha = null;
        } finally {
          button.disabled = false;
        }
      };

      document.getElementById("verify").onclick = async function () {
        const code = document.getElementById("otp").value.trim();

        if (!/^\d{6}$/.test(code)) {
          setStatus("Enter the 6-digit OTP.");
          return;
        }

        if (!confirmation) {
          setStatus("Request an OTP first.");
          return;
        }

        const button = document.getElementById("verify");
        button.disabled = true;

        try {
          const result = await confirmation.confirm(code);
          const idToken = await result.user.getIdToken(true);

          sendValue({
            type: "phone_verified",
            phoneNumber: result.user.phoneNumber || lastPhone,
            idToken: idToken,
            nonce: args.nonce || ""
          });

          setStatus("Phone number verified successfully.", true);
        } catch (error) {
          setStatus("OTP verification failed. Check the code and retry.");
        } finally {
          button.disabled = false;
        }
      };
    }

    function renderCaptcha(args) {
      const root = document.getElementById("root");

      root.innerHTML = `
        <div>
          <strong>🛡️ Security verification</strong>
          <p class="hint">
            Complete reCAPTCHA before continuing.
          </p>

          <div id="captcha-box"></div>

          <div id="status" class="status">
            Please complete the checkbox.
          </div>
        </div>
      `;

      if (!args.siteKey) {
        setStatus("reCAPTCHA site key is missing.");
        return;
      }

      function createCaptcha() {
        if (!window.grecaptcha || !window.grecaptcha.render) {
          setStatus("Google reCAPTCHA is not ready. Please wait or refresh.");
          return;
        }

        try {
          captchaWidget = window.grecaptcha.render("captcha-box", {
            sitekey: args.siteKey,

            callback: function (token) {
              sendValue({
                type: "captcha",
                token: token,
                nonce: args.nonce || ""
              });

              setStatus("Verification complete.", true);
            },

            "expired-callback": function () {
              sendValue({
                type: "captcha",
                token: "",
                nonce: args.nonce || ""
              });

              setStatus("Verification expired. Complete it again.");
            },

            "error-callback": function () {
              setStatus(
                "reCAPTCHA failed to load. Check your connection and site key."
              );
            }
          });
        } catch (error) {
          setStatus("Could not render reCAPTCHA: " + error.message);
        }
      }

      if (window.grecaptcha && window.grecaptcha.render) {
        createCaptcha();
        return;
      }

      if (captchaScriptLoading) {
        return;
      }

      captchaScriptLoading = true;

      window.krushiCaptchaReady = function () {
        captchaScriptLoading = false;
        createCaptcha();
      };

      const script = document.createElement("script");

      script.src =
        "https://www.google.com/recaptcha/api.js" +
        "?onload=krushiCaptchaReady&render=explicit";

      script.async = true;
      script.defer = true;

      script.onerror = function () {
        captchaScriptLoading = false;
        setStatus("Google reCAPTCHA script could not load.");
      };

      document.head.appendChild(script);
    }

    function render(args) {
      currentArgs = args || {};
      mode = currentArgs.mode || "";

      if (mode === "phone") {
        renderPhone(currentArgs);
      } else if (mode === "captcha") {
        renderCaptcha(currentArgs);
      } else {
        showError("Verification mode is not configured.");
      }

      if (Streamlit && Streamlit.setFrameHeight) {
        Streamlit.setFrameHeight(240);
      }
    }

  function initializeComponent() {
    Streamlit.events.addEventListener(
        Streamlit.RENDER_EVENT,
        function (event) {
            render(event.detail.args);
        }
    );

    Streamlit.setComponentReady();
    Streamlit.setFrameHeight(240);
}

window.addEventListener("load", initializeComponent);
  </script>
</body>
</html>
